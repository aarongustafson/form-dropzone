<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>form-dropzone via esm.sh</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<h1>esm.sh demo</h1>
		<form-dropzone preview-images>
			<label for="esm-images">Choose images</label>
			<input
				id="esm-images"
				name="images"
				type="file"
				accept="image/*"
				multiple
			/>
		</form-dropzone>

		<script type="module">
			import { FormDropzoneElement } from 'https://esm.sh/@aarongustafson/form-dropzone@0.0.1/form-dropzone.js?bundle&target=es2022';

			if (!customElements.get('form-dropzone')) {
				customElements.define('form-dropzone', FormDropzoneElement);
			}
		</script>
	</body>
</html>
