<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>form-dropzone via unpkg</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<h1>unpkg demo</h1>
		<form-dropzone>
			<label for="unpkg-document">Choose a PDF</label>
			<input
				id="unpkg-document"
				name="document"
				type="file"
				accept=".pdf"
			/>
		</form-dropzone>

		<script type="module">
			import { defineFormDropzone } from 'https://unpkg.com/@aarongustafson/form-dropzone@latest/define.js?module';

			defineFormDropzone();
		</script>
	</body>
</html>
